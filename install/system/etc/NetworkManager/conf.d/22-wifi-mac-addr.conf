# Hides /usr/lib/NetworkManager/conf.d/22-wifi-mac-addr.conf, which since
# Fedora 40 gives every Wi-Fi profile a generated per-SSID MAC (stable-ssid).
# The office network only lets registered hardware MACs on, so connect with the
# permanent address. Scans still use random MACs (wifi.scan-rand-mac-address).
# A profile can still opt out with: nmcli connection modify "$PROFILE" wifi.cloned-mac-address stable-ssid

[connection.22-wifi-mac-addr]
match-device=type:wifi
wifi.cloned-mac-address=permanent
