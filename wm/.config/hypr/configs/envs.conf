env = QT_IM_MODULE,fcitx
env = SDL_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = ALTERNATE_EDITOR,
env = EDITOR, nvim
env = BROWSER, firefox
env = LANG, en_US.UTF-8
env = XDG_SESSION_TYPE, wayland
env = XCURSOR_SIZE, 24
env = QT_QPA_PLATFORMTHEME, qt5ct
env = _JAVA_AWT_WM_NONREPARENTING, 1
env = WORKON_HOME, $HOME/.virtualenvs
env = XDG_DATA_DIRS, /var/lib/flatpak/exports/share:$HOME/.local/share/flatpak/exports/share:/usr/local/share:/usr/share
env = XDG_PICTURES_DIR, $HOME/Pictures
env = XDG_SCREENSHOTS_DIR, $HOME/Pictures/Screenshots
env = LD_LIBRARY_PATH, /usr/local/cuda-12.4/lib64/
env = MOZ_WEBRENDER, 1
env = PATH, $HOME/bin:$HOME/.local/bin:$HOME/.cargo/bin:/usr/local/bin:/usr/bin:/usr/local/sbin:/usr/sbin

# GPU / display env lives in a per-machine file (gitignored, like monitors.conf)
# because the correct values depend on which GPU the displays are wired to.
# See gpu.conf.example.
source = gpu.conf
