# No AQ_DRM_DEVICES pin: hyprlock picks the device the compositor scans out on.
# Pinning it to a card number is machine-specific and, on a muxless laptop where
# the displays hang off the iGPU, pinning the dGPU renders the full-screen lock
# image cross-GPU -- which is one of the surfaces that showed up garbled.
$SCREENLOCK = hyprlock
# $SCREENLOCK = swaylock -f

general {
    lock_cmd = $SCREENLOCK       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 150                                # 2.5min.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
# listener {
#     timeout = 150                                          # 2.5min.
#     on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 # turn off keyboard backlight.
#     on-resume = brightnessctl -rd rgb:kbd_backlight        # turn on keyboard backlight.
# }

listener {
    timeout = 300                                 # 5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 330                                 # 5.5min
    on-timeout = hyprctl dispatch dpms off        # screen off when timeout has passed
    on-resume = hyprctl dispatch dpms on          # screen on when activity is detected after timeout has fired.
}

# Idle suspend is deliberately disabled: it tears down the network, which kills
# in-flight ssh sessions, and closing the lid still suspends normally when no
# external display is connected (logind HandleLidSwitch=suspend, while
# HandleLidSwitchDocked=ignore covers the docked case). Screen off above already
# saves the panel, which is the bulk of idle draw.
