# xdg-desktop-portal-hyprland config.
#
# Zoom's screencast consumer is an old CEF capturer that cannot accept DMA-BUF
# buffers (its GPU process falls back to SwiftShader). xdph offers DMA-BUF
# first, Zoom rejects it, xdph falls back to SHM, and the two ping-pong:
#
#   [sc] Incompatible formats, renegotiate stream
#   [pw] DMA-BUF allocation failed, falling back to SHM
#   [pipewire] Asked for a wl_shm buffer which is legacy.
#   [screencopy/pipewire] Out of buffers -> Retrying screencopy (1/10)
#   [screencopy] Stream destroyed
#
# Zero frames ever reach the consumer, so the receiver sees a black screen.
# Skipping the DMA-BUF offer entirely removes the renegotiation loop.
#
# The muxless hybrid GPU here (RTX 4050 + AMD Phoenix, see configs/gpu.conf)
# makes the DMA-BUF path fail more readily than on a single-GPU machine.

screencopy {
    force_shm = true

    # eDP-1 is 3200x2000, so one SHM frame is ~25 MB. Capping the rate keeps
    # the buffer pool from exhausting ("Out of buffers") during a share.
    max_fps = 30
}
